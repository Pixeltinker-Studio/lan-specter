[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-specter"
version = "0.1.0"
description = "Raspberry Pi LAN diagnostics tool for SPECTER ES-01 and RE-01."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lan-specter" }]
dependencies = [
    "bleak>=2.0,<4",
    "gpiozero>=2.0,<3",
]

[project.optional-dependencies]
screenshots = [
    "playwright>=1.40,<2",
]

[project.scripts]
specter = "specter.ui.cli:main"
specter-ui = "specter.ui.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specter.ui.web_static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
